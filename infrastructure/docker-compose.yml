services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustlayer}
      POSTGRES_USER: ${POSTGRES_USER:-trustlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustlayer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustlayer} -d ${POSTGRES_DB:-trustlayer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    env_file:
      - ./.env
    environment:
      TRUSTLAYER_ENV: ${TRUSTLAYER_ENV:-development}
      TRUSTLAYER_API_HOST: ${TRUSTLAYER_API_HOST:-0.0.0.0}
      TRUSTLAYER_API_PORT: ${TRUSTLAYER_API_PORT:-8000}
      TRUSTLAYER_API_DATABASE_URL: ${TRUSTLAYER_API_DATABASE_URL:-postgresql+asyncpg://trustlayer:trustlayer@postgres:5432/trustlayer}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TRUSTLAYER_API_PORT:-8000}:8000"
    command: ["sh", "-c", "uv run alembic -c /app/alembic.ini upgrade head && uv run uvicorn trustlayer.main:app --host 0.0.0.0 --port 8000"]

  web:
    build:
      context: ../apps/web
    environment:
      VITE_API_BASE_URL: ${TRUSTLAYER_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${TRUSTLAYER_WEB_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  postgres_data:
