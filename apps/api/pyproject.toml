[project]
name = "trustlayer-api"
version = "0.1.0"
description = "TrustLayer authorization API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.116.0,<0.117.0",
  "PyJWT>=2.10.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "psycopg2-binary>=2.9.10,<3.0.0",
  "sqlalchemy>=2.0.43,<2.1.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<0.29.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.12.0,<0.13.0",
  "testcontainers[postgres]>=4.9.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/trustlayer"]

[tool.hatch.build.targets.wheel]
packages = ["src/trustlayer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
